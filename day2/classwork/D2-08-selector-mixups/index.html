<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo House Menu</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <h1>Momo House Menu</h1>
      <nav id="main-menu">
        <a href="#steam">Steam</a>
        <a href="#fried">Fried</a>
        <a href="#jhol">Jhol</a>
      </nav>
    </header>
    <main>
      <h2>Our momos</h2>
      <div class="card" id="steam">
        <h3>Steam momo</h3>
        <p class="price">Rs. 150</p>
        <p>Ten soft momos with tomato achar. <a href="#order">Order</a></p>
      </div>
      <div class="Card" id="fried">
        <h3>Fried momo</h3>
        <p class="price">Rs. 180</p>
        <p>Crispy outside, juicy inside. <a href="#order">Order</a></p>
      </div>
      <div class="card" id="jhol">
        <h3>Jhol momo</h3>
        <p class="price">Rs. 200</p>
        <p>Momos in a warm sesame soup. <a href="#order">Order</a></p>
      </div>
      <h2 id="order">How to order</h2>
      <p>Tell Didi at the counter, or call 01-4412345.</p>
    </main>
  </body>
</html>
