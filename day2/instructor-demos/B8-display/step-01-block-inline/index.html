<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display · Queue and bench</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <h1>The queue and the bench</h1>
    <p>Block boxes stand in a queue:</p>
    <div class="box">Block 1</div>
    <div class="box">Block 2</div>
    <p>Inline boxes sit on a bench: <span class="seat">Aarav</span> <span class="seat">Sunita</span> <span class="seat">Rajan</span></p>
    <p>Inline-block: side by side, but each keeps its size: <span class="seat keeps-size">Pema</span> <span class="seat keeps-size">Bikash</span></p>
    <p>Display none: <span class="gone">Anjali left the room.</span> Visibility hidden: <span class="hidden">Didi</span> (her seat is still there).</p>
  </body>
</html>
