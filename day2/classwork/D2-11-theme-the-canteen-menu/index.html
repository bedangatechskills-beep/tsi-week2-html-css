<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSI Canteen Menu</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <h1>TSI Canteen Menu</h1>
      <p>Fresh, hot and cheap. Run by Didi since 2018.</p>
    </header>
    <main>
      <h2>Lunch</h2>
      <table>
        <tr>
          <th scope="col">Dish</th>
          <th scope="col">Price</th>
        </tr>
        <tr>
          <td>Dal bhat with achar</td>
          <td>Rs. 180</td>
        </tr>
        <tr>
          <td>Veg chowmein</td>
          <td>Rs. 120</td>
        </tr>
        <tr>
          <td>Chicken momo (10 pieces)</td>
          <td>Rs. 150</td>
        </tr>
      </table>
      <h2>Drinks</h2>
      <p>Milk tea Rs. 25 · Black tea Rs. 20 · Lassi Rs. 60</p>
      <p class="note">Return your plate to the counter. Didi says thank you!</p>
    </main>
  </body>
</html>
