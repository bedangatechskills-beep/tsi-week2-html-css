<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo House — Parcels</title>
    <!-- No favicon on purpose: the Network tab then shows only our own 7 parcels. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <img src="images/logo-momo-house.svg" alt="Momo House logo" width="160">
    <h1>Momo House: a page made of parcels</h1>
    <p>This page is 1 HTML file, 1 CSS file and 5 pictures.</p>
    <p>Your browser asked the server for each one, like letters in the post. Each answer is a parcel.</p>
    <div class="photos">
      <img src="images/momo.svg" alt="A steaming plate of momo" width="200">
      <img src="images/momo-plate.svg" alt="Momo on a plate with achar" width="200">
      <img src="images/thamel.svg" alt="A busy street in Thamel" width="200">
      <img src="images/swayambhu.svg" alt="Swayambhunath stupa on its hill" width="200">
    </div>
    <p class="note">Count them: 1 + 1 + 5 = 7 parcels.</p>
  </body>
</html>
