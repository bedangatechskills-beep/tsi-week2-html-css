<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo House · Hover menu</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <img src="images/logo-momo-house.svg" alt="Momo House logo" class="logo" width="200" height="60">
      <nav>
        <ul class="menu">
          <li><a href="#home">Home</a></li>
          <li><a href="#dishes">Menu</a></li>
          <li><a href="#order">Order</a></li>
          <li><a href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1 id="home">Momo House</h1>
      <p>Move your mouse over the menu. Does it answer you?</p>
      <h2 id="dishes">Menu</h2>
      <p>Chicken, buff and veg momos.</p>
      <h2 id="order">Order</h2>
      <p>Call 01-4412345.</p>
      <h2 id="about">About</h2>
      <p>Didi has made momos in Dillibazar since 2015.</p>
    </main>
  </body>
</html>
