<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo House · Order</title>
  </head>
  <body>
    <header class="site-header">
      <img src="images/logo-momo-house.svg" alt="Momo House logo" class="logo" width="200" height="60">
      <nav>
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="order.html">Order</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Order your momos</h1>
      <p>Fill in the order slip. Didi will call you to confirm.</p>
      <form method="get" class="order-form">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required>
        <label for="momo">Momo</label>
        <select id="momo" name="momo">
          <option value="chicken">Chicken</option>
          <option value="buff">Buff</option>
          <option value="veg">Veg</option>
        </select>
        <label for="plates">Plates</label>
        <input type="number" id="plates" name="plates" min="1" max="20" value="1">
        <label for="notes">Notes for Didi</label>
        <textarea id="notes" name="notes" rows="4"></textarea>
        <button type="submit">Send order</button>
      </form>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 Momo House · Dillibazar, Kathmandu · Open every day, 10 am to 9 pm</p>
      <p>Phone: 01-4412345 · <a href="https://www.instagram.com/">Follow us on Instagram</a></p>
    </footer>
  </body>
</html>
