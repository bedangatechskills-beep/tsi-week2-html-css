<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Art</title>
  </head>
  <body>
    <h1>Didi's price board</h1>
    <p>Steam momo &rarr; Rs.&nbsp;150</p>
    <p>Fried momo &rarr; Rs.&nbsp;180</p>
    <p>Momo &amp; milk tea combo &rarr; Rs.&nbsp;170 &hearts;</p>
    <hr>
    <h2>A tiny HTML lesson</h2>
    <p>A paragraph starts with &lt;p&gt; and ends with &lt;/p&gt;.</p>
    <p>To print the &amp; sign itself, write &amp;amp;.</p>
    <hr>
    <p>&copy; 2026 TSI Canteen &amp; Momo House</p>
  </body>
</html>
