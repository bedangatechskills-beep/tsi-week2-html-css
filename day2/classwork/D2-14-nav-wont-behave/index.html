<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo House</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <img src="images/logo-momo-house.svg" alt="Momo House logo" class="logo" width="200" height="60">
      <nav>
        <ul class="menu">
          <li><a href="#home">Home</a></li>
          <li><a href="#dishes">Menu</a></li>
          <li><a href="#order">Order</a></li>
          <li><a href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="hero" id="home">
        <h1>Momo House</h1>
        <p>Hot momos, two minutes from TSI.</p>
        <a href="#order" class="order-button">Order now</a>
      </section>
      <section id="dishes">
        <h2>Menu</h2>
        <p>Chicken, buff and veg momos. Steam, fried or jhol.</p>
      </section>
      <section id="order">
        <h2>Order</h2>
        <p>Call 01-4412345 or tell Didi at the counter.</p>
      </section>
      <section id="about">
        <h2>About</h2>
        <p>Didi has made momos in Dillibazar since 2015.</p>
      </section>
    </main>
  </body>
</html>
