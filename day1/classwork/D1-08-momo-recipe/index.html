    <p>Makes 40 momo. Cooking time: 1 hour.</p>
    <!--
      Turn the text below into HTML. Then delete this comment.

      Ingredients (order does not matter):
        2 cups flour
        1 cup water
        500 g minced chicken
        1 onion
        Spices (make this a sub-list): ginger, garlic, cumin, salt

      Steps (order matters):
        Mix the flour and water into a soft dough.
        Mix the chicken, onion and spices.
        Roll small circles and put a spoon of filling in each one.
        Steam for 12 minutes.
