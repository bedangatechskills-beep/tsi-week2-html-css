<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About & contact · Rajan</title>
    <meta name="description" content="About Rajan and a contact form.">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <p class="brand">Rajan<span>.dev</span></p>
      <nav>
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About &amp; contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>About me</h1>
      <p>I fixed computers in my uncle's shop in New Road for three years. Now I build websites. I like clean code, strong milk tea and long walks around Rani Pokhari.</p>
      <section class="card">
        <h2>Contact me</h2>
        <form method="get">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" required>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4"></textarea>
          <button type="submit" class="button">Send</button>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 Rajan · Built with HTML and CSS at Tech Skills Institute, Kathmandu</p>
    </footer>
  </body>
</html>
