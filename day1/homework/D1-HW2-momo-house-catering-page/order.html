<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order — Momo House</title>
  </head>
  <body>
    <img src="images/logo-momo-house.svg" alt="Momo House logo" width="160">
    <p>
      <a href="index.html">Home</a> |
      <a href="menu.html">Menu</a> |
      <a href="order.html">Order</a> |
      <a href="about.html">About</a>
    </p>
    <h1>Order your momo</h1>
    <p>Fill in the order slip. Didi will call you when it is ready.</p>
    <form method="get">
      <p>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required>
      </p>
      <p>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required>
      </p>
      <p>
        <label for="momo">Which momo?</label>
        <select id="momo" name="momo">
          <option value="chicken">Chicken</option>
          <option value="veg">Veg</option>
          <option value="buff">Buff</option>
        </select>
      </p>
      <p>
        <label for="plates">Plates</label>
        <input type="number" id="plates" name="plates" min="1" max="10" value="1">
      </p>
      <p>
        <label for="notes">Notes for Didi</label><br>
        <textarea id="notes" name="notes" rows="3" cols="40"></textarea>
      </p>
      <button type="submit">Send order</button>
    </form>
    <p>&copy; 2026 Momo House, Dillibazar, Kathmandu</p>
  </body>
</html>
